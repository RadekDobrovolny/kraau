name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          build-cmd: npm run build
        env:
          # KRAAU Arcade (Skryté kurikulum) je zveřejněná; obsah her je pracovní verze
          # čekající na odbornou revizi. Smazáním řádku hernu opět skryjete.
          PUBLIC_KRAAU_ARCADE_PREVIEW: 'true'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
